# Full doc-gen4 documentation build. Split out of Lean Action CI: on a
# standard runner it exceeds the 6-hour job limit (doc-gen4 renders the whole
# Mathlib import closure), so it is manual-only. Seabed API docs are published
# via the SRI's tide-docs pipeline (trimmed per-repo docs with Mathlib
# references redirected to the hosted Mathlib docs) instead.

name: Docs

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The lean-common and threepoint dependencies are private repositories;
      # rewrite their URLs to authenticate with the read token so `lake` can
      # fetch them.
      - name: Configure private-dependency access
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.LEAN_COMMON_READ_TOKEN }}@github.com/timaeus-research/lean-common".insteadOf \
            "https://github.com/timaeus-research/lean-common"
          git config --global \
            url."https://x-access-token:${{ secrets.LEAN_COMMON_READ_TOKEN }}@github.com/timaeus-research/threepoint".insteadOf \
            "https://github.com/timaeus-research/threepoint"

      - uses: leanprover/lean-action@v1
      - uses: leanprover-community/docgen-action@v1
