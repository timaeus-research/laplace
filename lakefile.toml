name = "laplace"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Laplace", "Statements", "Solutions"]
enableArtifactCache = true

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0"

[[require]]
name = "Threepoint"
git = "https://github.com/timaeus-research/threepoint"
rev = "9eba560"

[[lean_lib]]
name = "Laplace"

# The main theorem statements and their proofs-by-delegation; see the README's
# "Main theorems" section.
[[lean_lib]]
name = "Statements"

[[lean_lib]]
name = "Solutions"

[[require]]
name = "resolution-common"
git = "https://github.com/timaeus-research/lean-common.git"
rev = "v0.5.0"
